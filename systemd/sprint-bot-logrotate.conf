# /etc/logrotate.d/sprint-bot
# Tự động xoay vòng log mỗi ngày, giữ 30 ngày

/var/log/sprint-bot/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP rsyslog.service 2>/dev/null || true
    endscript
}
