# /etc/rsyslog.d/sprint-bot.conf
# Chuyển log của sprint-bot services ra file riêng trong /var/log/

# Log từ sprint-bot
if $programname == 'sprint-bot' then /var/log/sprint-bot/app.log
if $programname == 'sprint-bot' then stop

# Log từ sprint-webhook
if $programname == 'sprint-webhook' then /var/log/sprint-bot/webhook.log
if $programname == 'sprint-webhook' then stop

# Log từ sprint-tunnel
if $programname == 'sprint-tunnel' then /var/log/sprint-bot/tunnel.log
if $programname == 'sprint-tunnel' then stop
